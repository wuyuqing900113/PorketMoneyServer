# ============================================================
# 零花钱管理系统后端服务 —— 公共配置
# 敏感值一律通过环境变量注入，禁止硬编码（mission.md 禁止项）
# 配置分层设计见 M0-detailed-design.md §7
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  # 生产部署于 SLB 之后：还原代理层的 scheme / client-ip（M1 设计 §8.4）
  forward-headers-strategy: native

spring:
  application:
    name: pocket-money-server
  profiles:
    default: local
  # JDK 25 虚拟线程处理请求（tech-stack.md 运行环境约束）
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345678}
    # HikariCP 参数基线：面向 10 TPS 场景，宁小勿大（M0 设计 §8.4）
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ============================================================
# M1 安全与加密配置（M1-detailed-design.md §11）
# 敏感密钥一律环境变量注入，无默认值 —— 缺失即启动失败（fail-fast）
# ============================================================
pocket-money:
  security:
    jwt:
      secret: ${JWT_SECRET:wPvsmgpqv5UI6Eg1XDYd7ndJvG9Sg9S9yMtnLMKwsIl50w/+k0fGHtLroqXvLQCuQnDEzzuoZO52rv6FBDEihg==}
      access-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-ttl: ${JWT_REFRESH_TTL:P14D}
    login-guard:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-duration: ${LOGIN_LOCK_DURATION:PT15M}
  crypto:
    data-key: ${DATA_ENCRYPTION_KEY:FSPwEaOq1XjrUGYj5ekUe8tx73cgu8pZfYbN1oKn8dA=}
  # ============================================================
  # M2 零花钱域配置（M2-detailed-design.md §13）
  # cron 为 Spring 6 段式（秒 分 时 日 月 周）
  # ============================================================
  money:
    settlement:
      # 结算总开关：集成测试置 false，直调 service 验证
      enabled: ${RULE_SETTLEMENT_ENABLED:true}
      cron: ${RULE_SETTLEMENT_CRON:0 7 1 * * *}    # 每日 01:07
    reconcile:
      cron: ${RECONCILE_CRON:0 13 2 * * 0}         # 每周日 02:13
  rule:
    # 单个受益人的生效规则上限
    max-per-member: ${RULE_MAX_PER_MEMBER:10}
    expiry-cron: ${RULE_EXPIRY_CRON:0 23 1 * * *}  # 每日 01:23
  # ============================================================
  # M3 可靠性配置（M3-detailed-design.md §11）
  # ============================================================
  idempotency:
    key-max-length: ${IDEMPOTENCY_KEY_MAX_LENGTH:64}
    ttl: ${IDEMPOTENCY_TTL:P7D}
    takeover-grace: ${IDEMPOTENCY_TAKEOVER_GRACE:PT60S}
    cleanup-enabled: ${IDEMPOTENCY_CLEANUP_ENABLED:true}
    cleanup-cron: ${IDEMPOTENCY_CLEANUP_CRON:0 37 3 * * *}  # 每日 03:37
  resilience:
    rate-limit:
      limit-for-period: ${RATE_LIMIT_FOR_PERIOD:10}
      limit-refresh-period: ${RATE_LIMIT_REFRESH_PERIOD:PT1M}
